<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Clientes - Doceria</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; }
        h1 { color: #8B4513; text-align: center; }
        table { width: 100%; max-width: 900px; margin: 20px auto; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th { background-color: #8B4513; color: white; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background-color: #fafafa; }
        .btn-apagar { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-apagar:hover { background-color: #c82333; }
        .aviso { text-align: center; color: #666; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>Gerenciar Clientes</h1>

    <table id="tabelaClientes">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
    </table>

    <p id="mensagemCarregando" class="aviso">Carregando clientes...</p>

    <script>
        const corpoTabela = document.getElementById('corpoTabela');
        const avisoCarregando = document.getElementById('mensagemCarregando');

        function carregarTabela() {
            let clientes = JSON.parse(localStorage.getItem('clientes_doceria')) || [];

            if (clientes.length === 0) {
                avisoCarregando.textContent = 'Nenhum cliente cadastrado.';
                corpoTabela.innerHTML = '';
                return;
            }

            avisoCarregando.style.display = 'none';
            let html = '';

            for (let i = 0; i < clientes.length; i++) {
                let c = clientes[i];
                html += `
                    <tr id="linha-${c.id}">
                        <td>${c.id}</td>
                        <td><strong>${c.nome}</strong></td>
                        <td>${c.cpf}</td>
                        <td>
                            <button class="btn-apagar" onclick="apagarCliente(${c.id})">Apagar</button>
                        </td>
                    </tr>
                `;
            }
            corpoTabela.innerHTML = html;
        }

        function apagarCliente(id) {
            if (!confirm('Tem certeza que deseja apagar este cliente?')) return;

            let clientes = JSON.parse(localStorage.getItem('clientes_doceria')) || [];
            let novosClientes = [];

            for (let i = 0; i < clientes.length; i++) {
                if (clientes[i].id !== id) {
                    novosClientes.push(clientes[i]);
                }
            }

            localStorage.setItem('clientes_doceria', JSON.stringify(novosClientes));
            carregarTabela();
            alert('Cliente apagado com sucesso!');
        }

        carregarTabela();
    </script>
</body>
</html>
