    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Adicionar Cliente - Doceria</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
                margin: 0;
                padding: 20px;
            }

            .container {
                max-width: 500px;
                margin: 0 auto;
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }

            h1 {
                color: #8B4513;
                text-align: center;
                margin-top: 0;
            }

            .campo {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #333;
            }

            input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 14px;
                box-sizing: border-box;
            }

            button {
                width: 100%;
                padding: 12px;
                background-color: #8B4513;
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            }

            button:hover {
                background-color: #A0522D;
            }

            .mensagem {
                margin-top: 15px;
                padding: 10px;
                text-align: center;
                border-radius: 5px;
                display: none;
            }

            .sucesso {
                background-color: #d4edda;
                color: #155724;
                display: block;
            }

            .erro {
                background-color: #f8d7da;
                color: #721c24;
                display: block;
            }
        </style>
    </head>

    <body>

        <div class="container">

            <h1>Adicionar Cliente</h1>

            <form id="formCliente">

                <div class="campo">
                    <label>Nome *</label>
                    <input type="text" id="nome" required placeholder="Ex: João da Silva">
                </div>

                <div class="campo">
                    <label>CPF *</label>
                    <input
                        type="text"
                        id="cpf"
                        required
                        placeholder="000.000.000-00"
                        maxlength="14"
                        autocomplete="off"
                    >
                </div>

                <button type="submit">Adicionar Cliente</button>

            </form>

            <div id="msg" class="mensagem"></div>

        </div>

        <script>
            // ===== Função de validação do CPF =====
            function validarCPF(cpf) {
                // Remove caracteres não numéricos
                cpf = cpf.replace(/[^\d]/g, '');

                // Verifica se tem 11 dígitos
                if (cpf.length !== 11) return false;

                // Rejeita CPFs com todos os dígitos iguais
                if (/^(\d)\1{10}$/.test(cpf)) return false;

                // Valida os dois dígitos verificadores
                for (let t = 9; t < 11; t++) {
                    let soma = 0;
                    for (let i = 0; i < t; i++) {
                        soma += parseInt(cpf[i]) * ((t + 1) - i);
                    }
                    const digito = ((soma * 10) % 11) % 10;
                    if (parseInt(cpf[t]) !== digito) return false;
                }

                return true;
            }

            // ===== Função que aplica a máscara enquanto digita =====
            function aplicarMascara(input) {
                let valor = input.value.replace(/\D/g, '').slice(0, 11);
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
                valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
                valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
                input.value = valor;
            }

            // ===== Função principal chamada pelo botão =====
            function validar() {
                const input = document.getElementById('cpf');
                const resultado = document.getElementById('msg');
                const cpf = input.value.trim();

                // Remove classes de estado anterior
                input.classList.remove('valido', 'invalido');
                resultado.className = 'mensagem';

                // Verifica se o campo está vazio
                if (cpf === '') {
                    resultado.textContent = 'Por favor, digite um CPF.';
                    resultado.classList.add('erro');
                    return false;
                }

                // Executa a validacao
                if (validarCPF(cpf)) {
                    resultado.textContent = 'Cliente cadastrado com sucesso!';
                    resultado.classList.add('sucesso');
                    input.classList.add('valido');
                    return true;
                } else {
                    resultado.textContent = 'CPF inválido!';
                    resultado.classList.add('erro');
                    input.classList.add('invalido');
                    return false;
                }
            }

            // ===== Eventos =====
            const campoCpf = document.getElementById('cpf');
            const formCliente = document.getElementById('formCliente');

            // Aplica mascara enquanto o usuario digita
            campoCpf.addEventListener('input', function () {
                aplicarMascara(this);
            });

            // Permite validar pressionando Enter
            campoCpf.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    validar();
                }
            });

// Evento de submissão do formulário
        formCliente.addEventListener('submit', function (e) {
            e.preventDefault();
            if (validar()) {
                const novoCliente = {
                    id: Date.now(),
                    nome: document.getElementById('nome').value,
                    cpf: document.getElementById('cpf').value
                };

                let clientesSalvos = JSON.parse(localStorage.getItem('clientes_doceria')) || [];
                clientesSalvos.push(novoCliente);
                localStorage.setItem('clientes_doceria', JSON.stringify(clientesSalvos));

                document.getElementById('nome').value = '';
                document.getElementById('cpf').value = '';
            }
        });
        </script>
    </body>
    </html>
